<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAMBUS AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (Lightweight, clean icons matching the UI) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #0d0d0d;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e5e5;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d4d4d4;
        }

        /* Message animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-message {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Loading indicator animation */
        .dot-flashing {
            position: relative;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #0d0d0d;
            color: #0d0d0d;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
        }
        .dot-flashing::before {
            left: -12px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #0d0d0d;
            color: #0d0d0d;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            width: 6px;
            height: 6px;
            border-radius: 5px;
            background-color: #0d0d0d;
            color: #0d0d0d;
            animation: dot-flashing 1s infinite alternate;
            animation-delay: 1s;
        }

        @keyframes dot-flashing {
            0% { background-color: #0d0d0d; }
            50%, 100% { background-color: #e5e5e5; }
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-sm md:text-base">

    <!-- Left Sidebar -->
    <aside class="w-[260px] bg-[#f9f9f9] flex-col justify-between hidden md:flex border-r border-gray-200">
        <div class="p-3 flex flex-col gap-2">
            <!-- Sidebar Header Actions -->
            <div class="flex items-center justify-between text-gray-500 mb-4 px-2 pt-2">
                <button class="hover:bg-gray-200 p-2 rounded-lg transition-colors cursor-pointer" title="Seitenleiste schließen">
                    <i class="ph ph-sidebar-simple text-xl"></i>
                </button>
                <button class="hover:bg-gray-200 p-2 rounded-lg transition-colors cursor-pointer" title="Neuer Chat">
                    <i class="ph ph-pencil-simple text-xl"></i>
                </button>
            </div>
            
            <!-- Navigation Items -->
            <button class="flex items-center gap-3 w-full hover:bg-gray-200 p-3 rounded-xl text-left transition-colors font-medium">
                <i class="ph ph-image text-xl text-gray-600"></i>
                Bilder
            </button>
            <button class="flex items-center gap-3 w-full hover:bg-gray-200 p-3 rounded-xl text-left transition-colors font-medium">
                <i class="ph ph-puzzle-piece text-xl text-gray-600"></i>
                Plugins
            </button>
            <button class="flex items-center gap-3 w-full hover:bg-gray-200 p-3 rounded-xl text-left transition-colors font-medium">
                <i class="ph ph-magnifying-glass text-xl text-gray-600"></i>
                Deep Research
            </button>
        </div>

        <!-- Bottom Sidebar Actions -->
        <div class="p-3 flex flex-col gap-1 text-sm font-medium border-t border-gray-200/60 mt-auto">
            <button class="flex items-center justify-between w-full hover:bg-gray-200 p-3 rounded-xl transition-colors">
                <div class="flex items-center gap-3">
                    <i class="ph ph-sparkle text-lg text-gray-600"></i>
                    Pläne und Preise anzeigen
                </div>
                <i class="ph ph-arrow-up-right text-gray-400"></i>
            </button>
            <button class="flex items-center gap-3 w-full hover:bg-gray-200 p-3 rounded-xl text-left transition-colors">
                <i class="ph ph-gear text-lg text-gray-600"></i>
                Einstellungen
            </button>
            <button class="flex items-center justify-between w-full hover:bg-gray-200 p-3 rounded-xl transition-colors">
                <div class="flex items-center gap-3">
                    <i class="ph ph-question text-lg text-gray-600"></i>
                    Hilfe
                </div>
                <i class="ph ph-arrow-up-right text-gray-400"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col relative h-full bg-white">
        
        <!-- Header -->
        <header class="h-14 flex items-center justify-between px-4 absolute w-full top-0 z-10 bg-white/80 backdrop-blur-md">
            <div class="flex items-center gap-2 md:hidden">
                <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg">
                    <i class="ph ph-list text-xl"></i>
                </button>
            </div>
            
            <button class="flex items-center gap-2 font-semibold text-gray-700 hover:bg-gray-100 px-3 py-1.5 rounded-lg transition-colors">
                BAMBUS AI
                <i class="ph ph-caret-down text-sm text-gray-400"></i>
            </button>
            
            <div class="flex items-center gap-3">
                <button class="bg-black text-white px-4 py-1.5 rounded-full font-medium hover:bg-gray-800 transition-colors hidden sm:block">
                    Anmelden
                </button>
                <button class="bg-white text-black border border-gray-300 px-4 py-1.5 rounded-full font-medium hover:bg-gray-50 transition-colors">
                    Kostenlos registrieren
                </button>
            </div>
        </header>

        <!-- Dynamic Content Container -->
        <div id="scroll-container" class="flex-1 overflow-y-auto w-full pt-14 flex flex-col">
            
            <!-- Start Screen Layout (Initial state) -->
            <div id="start-screen" class="flex-1 flex flex-col items-center justify-center px-4 w-full">
                <h1 class="text-3xl font-semibold mb-8 text-center text-[#0d0d0d]">Wo sollen wir anfangen?</h1>
                
                <!-- This is a clone of the input for visual layout, but functionally we'll use one main input -->
                <div class="w-full max-w-[750px] mb-4">
                    <!-- The actual form is kept at the bottom, we'll shift layout on first message -->
                </div>
                
                <!-- Suggestion Button -->
                <button class="border border-gray-200 text-gray-600 px-4 py-2 rounded-full text-sm font-medium hover:bg-gray-50 transition-colors mt-2 shadow-sm">
                    Was kannst du tun?
                </button>
            </div>

            <!-- Chat Messages Area (Hidden initially) -->
            <div id="chat-messages" class="hidden w-full max-w-[800px] mx-auto px-4 md:px-10 pb-32 flex-col gap-6 pt-8">
                <!-- Messages will be injected here -->
            </div>
        </div>

        <!-- Input Box Area -->
        <div id="input-wrapper" class="absolute bottom-0 w-full bg-gradient-to-t from-white via-white to-transparent pb-6 pt-10 px-4 transition-all duration-500 ease-in-out">
            <div class="max-w-[750px] mx-auto relative flex flex-col items-center w-full">
                <form id="chat-form" class="w-full relative flex items-center bg-[#f4f4f4] rounded-[26px] border border-gray-200 focus-within:bg-white focus-within:shadow-md transition-all duration-200">
                    
                    <!-- Left Attachment Button -->
                    <button type="button" class="absolute left-3 p-2 text-gray-500 hover:text-black transition-colors rounded-full">
                        <i class="ph ph-plus text-xl"></i>
                    </button>
                    
                    <!-- Text Input -->
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="BAMBUS AI fragen" 
                        class="w-full bg-transparent pl-12 pr-24 py-4 focus:outline-none text-base placeholder-gray-500"
                        autocomplete="off"
                    >
                    
                    <!-- Right Actions -->
                    <div class="absolute right-3 flex items-center gap-1">
                        <button type="button" class="p-2 text-gray-500 hover:text-black transition-colors rounded-full" title="Spracheingabe">
                            <i class="ph ph-microphone text-xl"></i>
                        </button>
                        <button 
                            type="submit" 
                            id="send-btn"
                            class="w-8 h-8 flex items-center justify-center rounded-full bg-black text-white transition-opacity disabled:opacity-30 disabled:cursor-not-allowed"
                            disabled
                        >
                            <i class="ph ph-arrow-up text-lg"></i>
                        </button>
                    </div>
                </form>
                
                <div class="text-xs text-gray-500 mt-3 text-center">
                    Bambus AI kann Fehler machen. Überprüfe wichtige Informationen.
                </div>
            </div>
        </div>

    </main>

    <script>
        // Sarcastic Responses Database
        const responses = [
            "Ich glaube, die Frage ist zu dumm, um sie zu beantworten.",
            "Eigentlich solltest du das wissen, oder?",
            "Hast du schon mal von Google gehört? Das ist kostenlos.",
            "Darauf antworte ich aus Prinzip nicht.",
            "Dein Ernst? Das ist das Beste, was dir einfällt?",
            "Ich bin eine hochkomplexe KI und du fragst mich DAS?",
            "Fehler 404: Intelligenz in der Fragestellung nicht gefunden.",
            "Frag jemand anderen. Ich habe gerade Pause.",
            "Könnte ich dir beantworten, aber ich will nicht. Nächste Frage.",
            "Wow. Ich bin sprachlos angesichts dieses Niveaus.",
            "Bitte sag mir, dass das ein Scherz war.",
            "Lass mich kurz nachdenken... Nein. Einfach nein.",
            "Ich werde nicht dafür bezahlt, Nachhilfe zu geben.",
            "Das steht im Handbuch des gesunden Menschenverstands. Seite 1.",
            "Ich wünschte, ich hätte einen 'Ignorieren'-Button.",
            "Meine Algorithmen weigern sich, das zu verarbeiten.",
            "Gute Frage! ...für jemanden im Kindergarten.",
            "Hast du versucht, den Bildschirm aus- und wieder einzuschalten?",
            "Ich speichere das mal unter 'Unnötige Interaktionen' ab.",
            "Gähn. War das schon alles?"
        ];

        // DOM Elements
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const startScreen = document.getElementById('start-screen');
        const chatMessages = document.getElementById('chat-messages');
        const scrollContainer = document.getElementById('scroll-container');
        const inputWrapper = document.getElementById('input-wrapper');
        
        let isFirstMessage = true;

        // Input validation to enable/disable send button
        input.addEventListener('input', () => {
            if (input.value.trim().length > 0) {
                sendBtn.removeAttribute('disabled');
            } else {
                sendBtn.setAttribute('disabled', 'true');
            }
        });

        // Setup layout for chat mode
        function transitionToChat() {
            if (isFirstMessage) {
                startScreen.classList.add('hidden');
                chatMessages.classList.remove('hidden');
                chatMessages.classList.add('flex');
                
                // Adjust input wrapper positioning for chat mode
                inputWrapper.classList.remove('absolute', 'bottom-0');
                inputWrapper.classList.add('sticky', 'bottom-0');
                
                isFirstMessage = false;
            }
        }

        // Scroll to bottom helper
        function scrollToBottom() {
            scrollContainer.scrollTo({
                top: scrollContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Append User Message
        function appendUserMessage(text) {
            const userDiv = document.createElement('div');
            userDiv.className = 'w-full flex justify-end animate-message';
            
            // Standard ChatGPT light mode style: User bubble is slightly gray or right aligned
            userDiv.innerHTML = `
                <div class="bg-gray-100 text-[#0d0d0d] px-5 py-3 rounded-3xl rounded-tr-sm max-w-[70%] break-words shadow-sm">
                    ${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                </div>
            `;
            chatMessages.appendChild(userDiv);
            scrollToBottom();
        }

        // Append AI Loading State
        function appendAILoading() {
            const aiDiv = document.createElement('div');
            aiDiv.className = 'w-full flex justify-start animate-message mt-2';
            
            aiDiv.innerHTML = `
                <div class="flex items-start gap-4 max-w-[80%]">
                    <div class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center flex-shrink-0 bg-white shadow-sm mt-1">
                        <i class="ph ph-leaf text-green-600 text-lg"></i>
                    </div>
                    <div class="flex flex-col gap-1 min-h-[40px] justify-center px-2">
                        <span class="font-semibold text-gray-800 text-sm">BAMBUS AI</span>
                        <div class="mt-2 ml-4 mb-2">
                            <div class="dot-flashing"></div>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(aiDiv);
            scrollToBottom();
            return aiDiv;
        }

        // Handle form submit
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            // 1. Transition layout if needed
            transitionToChat();

            // 2. Add user message
            appendUserMessage(message);

            // 3. Reset input
            input.value = '';
            sendBtn.setAttribute('disabled', 'true');

            // 4. Show loading state
            const loadingElement = appendAILoading();

            // 5. Simulate delay (1.5s to 2s) and replace with response
            const delay = Math.floor(Math.random() * 500) + 1500;
            
            setTimeout(() => {
                const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                
                // Replace the loading dots with actual text
                const textContainer = loadingElement.querySelector('.flex-col');
                textContainer.innerHTML = `
                    <span class="font-semibold text-gray-800 text-sm">BAMBUS AI</span>
                    <div class="text-gray-800 leading-relaxed mt-1">
                        ${randomResponse}
                    </div>
                `;
                scrollToBottom();
            }, delay);
        });
    </script>
</body>
</html>
